# This service only. barber-saas-infra-postgres includes this file to compose the platform.
services:
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      HEALTH_PORT: "8080"
      # The worker's own token (sub: barber-saas-worker), never a user's (ADR-016).
      SERVICE_TOKEN: ${WORKER_SERVICE_TOKEN:?run barber-saas-infra-postgres/scripts/dev-keys.sh}
      # Producers whose outbox it relays (DEC-APPT-07, DEC-AUTH-08, DEC-LOY-04).
      PRODUCERS: ${WORKER_PRODUCERS:-appointment,identity-auth,loyalty}
      # Consumers that take POST /internal/v1/events (loyalty since L-3, DEC-LOY-05). One left out
      # keeps its events waiting in the producer's outbox instead of failing them.
      CONSUMERS: ${WORKER_CONSUMERS:-loyalty,notifications}
      APPOINTMENT_API_URL: http://appointment-api:8080
      PLATFORM_ADMIN_API_URL: http://platform-admin-api:8080
      LOYALTY_API_URL: ${WORKER_LOYALTY_API_URL:-http://loyalty-api:8080}
      NOTIFICATIONS_API_URL: ${WORKER_NOTIFICATIONS_API_URL:-http://notifications-api:8080}
      IDENTITY_AUTH_API_URL: http://identity-auth-api:8080
      # Daily jobs, Colombia time (UTC-5, no daylight saving).
      UTC_OFFSET_HOURS: "-5"
      REMINDERS_AT: "18:00"
      NO_SHOWS_AT: "01:00"
      TRIALS_AT: "02:00"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 128m
    # expose, not ports: nothing outside the network calls the worker (norm 5.7.1).
    expose: ["8080"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
